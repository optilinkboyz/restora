[package]
name = "restora-infra"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true

# Platform-specific raw device access. Only compiled on their target OS.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Foundation",
] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["fs", "ioctl"] }

[dev-dependencies]
# Pinned: newer tempfile pulls in getrandom versions requiring edition2024,
# which the apt-packaged cargo (1.75) in this sandbox can't parse. If your
# real WSL install uses rustup (recommended, see notes), you can drop this
# pin and just use `tempfile = "3"`.
tempfile = "=3.8.1"
